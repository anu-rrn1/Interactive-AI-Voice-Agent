# Render Blueprint: one web service that serves both the page and the backend.
# API keys use `sync: false`, so Render asks for them on deploy and they never live in the repo.
services:
  - type: web
    name: voice-ai-chat-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /personas
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.3
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MURF_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
